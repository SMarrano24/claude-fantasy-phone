<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; manifest-src 'self' data:; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1c1c1b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fantasy">
<meta name="format-detection" content="telephone=no">
<title>Claude Fantasy</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<style>
/* v3 (2026-11-16): four tabs, short rows you tap, details in a sheet. The Mac app's colors and rounded type (fantasy/ui.py). */
:root{color-scheme:dark;--bg:#1c1c1b;--bg2:#222221;--card:#2a2a28;--card2:#323230;--line:#3a3a37;--line2:#4a4a46;
--ink:#f5f3ee;--muted:#a5a297;--soft:#d2cec4;--clay:#d97757;--turf:#6dbb7f;--ice:#7db4e6;
--good:#6dbb7f;--bad:#ef8a6c;--warn:#e7b65a;--tip:#9fb3e8;--badbg:#3f2723;--warnbg:#3b3120;--goodbg:#233328;--tipbg:#262d3d;
--round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,sans-serif;
--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace;
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
--ease:cubic-bezier(.2,.7,.2,1);--tabh:58px;--s:var(--clay)}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--sans);-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none;border:0;background:none;padding:0;margin:0;text-align:inherit}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--clay);outline-offset:2px}
[hidden]{display:none!important}
.muted{color:var(--muted)}.up{color:var(--good)}.down{color:var(--bad)}.small{font-size:13px}.tiny{font-size:12px}
.football{--s:var(--turf)}.hockey{--s:var(--ice)}

/* ---------- lock screen ---------- */
#lock{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(var(--sat) + 30px) 28px calc(var(--sab) + 30px);text-align:center;
  background:radial-gradient(120% 60% at 50% 0%,#2f2a26 0%,var(--bg) 60%)}
#lock img{width:96px;height:96px;border-radius:22px;box-shadow:0 18px 40px -16px rgba(0,0,0,.7)}
#lock h1{font:800 28px/1.1 var(--round);margin:22px 0 6px;letter-spacing:-.01em}
#lock p{margin:0;color:var(--muted)}
#lock form{width:100%;max-width:340px;margin-top:28px;display:flex;flex-direction:column;gap:12px}
#lock input{width:100%;font:600 17px var(--round);color:var(--ink);background:var(--card);border:1px solid var(--line2);
  border-radius:14px;padding:15px 16px;text-align:center;letter-spacing:.04em;outline:none}
#lock input:focus{border-color:var(--clay)}
#lockmsg{min-height:20px;font-size:14px;color:var(--bad)}
#lockmsg.busy{color:var(--muted)}
.lock-help{margin-top:26px;font-size:13px;color:var(--muted);max-width:320px}

/* ---------- buttons, pills ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:12px;min-height:44px;padding:10px 16px;
  font:700 15px var(--round);background:var(--card2);color:var(--ink);text-decoration:none;transition:transform .12s var(--ease),opacity .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--clay);color:#1c1c1b}.btn.big{min-height:50px;font-size:16.5px;border-radius:14px}
.btn.ghost{background:transparent;border:1px solid var(--line2)}.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn.good{background:var(--goodbg);color:var(--good)}.btn.bad{background:var(--badbg);color:var(--bad)}
.btn[disabled]{opacity:.5}.btn .ell{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:8px;margin-top:12px}.acts .btn{flex:1}
.pill{display:inline-block;font:800 12px var(--round);padding:3px 8px;border-radius:7px;background:var(--card2);color:var(--soft);white-space:nowrap}
.pill.ok{background:var(--goodbg);color:var(--good)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.big{font-size:14px;padding:6px 11px;border-radius:9px}
.badge{display:inline-block;font:800 11px var(--round);padding:1px 6px;border-radius:6px;margin-left:5px;vertical-align:1px;background:var(--warnbg);color:var(--warn)}
.badge.h2,.badge.h3{background:var(--badbg);color:var(--bad)}
.live{color:var(--bad);font-weight:800}
.ava{flex:none;width:30px;height:30px;border-radius:50%;display:inline-grid;vertical-align:middle;place-items:center;font:800 14px var(--round);color:#1c1c1b;background:var(--c)}
.ava.sm{width:24px;height:24px;font-size:12px}
.chev{flex:none;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);margin:0 4px 0 2px}
.linkish{background:none;border:0;padding:0;color:var(--clay);font:700 13.5px var(--round);text-decoration:underline}

/* ---------- top bar: brand, freshness, crew; the leagues ---------- */
/* solid, never see-through (a blurred bar looked smeared on the iPhone), always padded by the status bar's safe area */
header.top{position:sticky;top:0;z-index:20;padding:calc(var(--sat) + 4px) calc(var(--sar) + 14px) 8px calc(var(--sal) + 14px);
  background:var(--bg);border-bottom:1px solid var(--line);transform:translateZ(0)}
.bar{display:flex;align-items:center;gap:8px;height:40px}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font:800 18px var(--round);letter-spacing:-.01em;white-space:nowrap;overflow:hidden}
.brand img{width:26px;height:26px;border-radius:7px}
.brand em{font-style:normal;color:var(--clay)}
.brand .ver{font:700 11.5px var(--round);color:var(--muted);letter-spacing:0;flex:none}
.brand>span{min-width:0;overflow:hidden;text-overflow:ellipsis}
@media (max-width:389px){.bar{gap:6px}.brand{font-size:15.5px;gap:6px}.brand img{width:22px;height:22px}.when{padding:0 10px;gap:5px}.when svg{display:none}}
.when{flex:none;display:flex;align-items:center;gap:6px;height:36px;padding:0 11px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);
  font:700 13px var(--round);color:var(--soft);font-variant-numeric:tabular-nums}
.when i{width:8px;height:8px;border-radius:50%;background:var(--good)}
.when.late i,.when.stale i{background:var(--warn)}.when.stale{color:var(--warn)}
.when svg,.iconbtn svg{fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.when svg{width:14px;height:14px}.when.spin svg{animation:spin .9s linear infinite}
.iconbtn{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--bg2);border:1px solid var(--line);color:var(--soft)}
.iconbtn svg{width:18px;height:18px}
.leagues{display:flex;gap:3px;margin-top:8px;padding:3px;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
.lgb{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:5px;height:34px;padding:0 8px;border-radius:9px;
  font:700 13.5px var(--round);color:var(--muted);position:relative;transition:background .2s,color .2s}
.lgb .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lgb.on{background:var(--card2);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.lgb .dot{position:absolute;top:4px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--bad)}

/* ---------- pages ---------- */
main{padding:12px calc(var(--sar) + 14px) calc(var(--sab) + var(--tabh) + 28px) calc(var(--sal) + 14px);max-width:620px;margin:0 auto}
main.in{animation:in .22s var(--ease)}main.slide-l{animation:sl .26s var(--ease)}main.slide-r{animation:sr .26s var(--ease)}
.ptr{height:0;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;color:var(--muted);font:600 13px var(--round);transition:height .2s var(--ease)}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin:18px 4px 8px;font:800 13px var(--round);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sh small{font:700 12.5px var(--round);letter-spacing:0;text-transform:none}
.empty{color:var(--muted);text-align:center;padding:22px 14px;margin:0;font-size:14px}
.hint{color:var(--muted);font-size:13px;margin:8px 4px}
.note{display:flex;align-items:center;gap:9px;min-height:44px;padding:8px 8px 8px 12px;border-radius:12px;margin-bottom:8px;font:650 13.5px/1.35 var(--round);width:100%;text-align:left}
.note>span:not(.chev):not(.go){flex:1;min-width:0}.note b{color:var(--ink)}
.note.tip{background:var(--tipbg);color:#c9d5f5}.note.warn{background:var(--warnbg);color:#f1d79e}.note.bad{background:var(--badbg);color:#f6c4b4}
.note .x{flex:none;width:32px;height:32px;border-radius:9px;font:500 20px/1 var(--sans);color:inherit;text-align:center}
.note .go{flex:none;font:800 13px var(--round);padding:7px 10px;min-height:32px;border-radius:9px;background:rgba(255,255,255,.1);color:var(--ink)}

/* the tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;
  padding:5px calc(var(--sar) + 8px) calc(var(--sab) + 5px) calc(var(--sal) + 8px);background:var(--bg);border-top:1px solid var(--line)}
.tab{flex:1;max-width:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:48px;
  font:700 11.5px var(--round);color:var(--muted);position:relative;border-radius:12px;transition:color .2s}
.tab svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--clay)}.tab:active{transform:scale(.94)}
.tab .n,.seg .n{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#1c1c1b;font:800 11px/18px var(--round);text-align:center}
.tab .n{position:absolute;top:0;left:calc(50% + 6px)}

/* Today: the scoreboard */
.hero{display:block;width:100%;padding:14px 16px;border-radius:20px;margin-bottom:8px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--s) 17%,var(--card)),var(--card) 68%);border:1px solid color-mix(in srgb,var(--s) 26%,transparent);transition:transform .12s var(--ease)}
.hero:active{transform:scale(.985)}
.h-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.tag{flex:none;font:800 11px var(--round);letter-spacing:.06em;text-transform:uppercase;color:var(--s);background:color-mix(in srgb,var(--s) 15%,transparent);padding:3px 8px;border-radius:7px}
.h-st{font:800 11.5px var(--round);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.h-st.on{color:var(--bad)}.h-st.on i{width:7px;height:7px;border-radius:50%;background:var(--bad);animation:pulse 1.3s infinite}
.h-score{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:end;gap:10px}
.h-side{min-width:0}.h-side.r{text-align:right}
.h-side b{display:block;font:800 42px/1 var(--round);font-variant-numeric:tabular-nums;color:var(--soft);letter-spacing:-.01em}
.h-side.lead b{color:var(--ink)}
.h-side span{display:block;margin-top:5px;font:700 13.5px var(--round);color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-side.me span::after{content:" · YOU";font:800 11px var(--round);letter-spacing:.06em;color:var(--clay)}
.h-vs{font:800 13px var(--round);color:var(--muted);padding-bottom:26px}
.h-bar{display:flex;height:8px;border-radius:8px;overflow:hidden;background:rgba(255,255,255,.1);margin-top:12px}
.h-bar i{display:block;background:var(--s);border-radius:8px;transition:width .7s var(--ease)}
.h-foot{display:flex;justify-content:space-between;gap:8px;margin-top:7px;font:700 12.5px var(--round);color:var(--soft)}
.h-foot span:last-child{color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{display:flex;flex-direction:column;min-width:0;min-height:72px;padding:10px 11px;border-radius:14px;background:var(--card);border:1px solid rgba(255,255,255,.04);text-align:left;transition:transform .12s var(--ease)}
.tile:active{transform:scale(.96);background:var(--card2)}
.tile small{font:800 11px var(--round);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tile b{font:800 20px/1.2 var(--round);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.tile span{font:600 12px var(--round);color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.up b{color:var(--good)}.tile.down b{color:var(--bad)}

/* lists of rows you tap */
.list{border-radius:16px;background:var(--card);overflow:hidden;border:1px solid rgba(255,255,255,.04)}
.row{width:100%;display:flex;align-items:center;gap:11px;min-height:58px;padding:9px 12px;text-align:left}
.row+.row{border-top:1px solid rgba(255,255,255,.06)}
.row:active{background:var(--card2)}
.r-ic{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font:800 16px var(--round);background:var(--icbg,var(--card2));color:var(--icc,var(--soft))}
.r-main{flex:1;min-width:0}
.r-main b{display:block;font:700 15px/1.25 var(--round);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-main small{display:block;font:600 12.5px var(--round);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.r-end{flex:none;text-align:right;font:800 16px/1.1 var(--round);font-variant-numeric:tabular-nums;color:var(--good)}
.r-end small{display:block;font:700 11px var(--round);color:var(--muted)}
.row.waiting .r-main small{color:var(--warn)}
.lv-urgent{--icbg:var(--badbg);--icc:var(--bad)}.lv-warn,.lv-tip{--icbg:var(--warnbg);--icc:var(--warn)}.lv-offer{--icbg:var(--tipbg);--icc:var(--tip)}
.lv-claim{--icbg:var(--goodbg);--icc:var(--good)}.lv-trade{--icbg:#3a2a22;--icc:#e9a487}.lv-move{--icbg:var(--card2);--icc:var(--soft)}
.allset{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--card);font:650 14px/1.35 var(--round);color:var(--soft)}
.allset .r-ic{--icbg:var(--goodbg);--icc:var(--good)}
.fold{width:100%;display:flex;align-items:center;gap:10px;min-height:46px;padding:0 14px;margin-top:8px;border-radius:14px;background:var(--card);font:750 14.5px var(--round);color:var(--soft);text-align:left}
.fold>span:not(.chev){flex:1}.fold small{font:700 12.5px var(--round);color:var(--muted)}
.fold .chev{transform:rotate(45deg) translate(-2px,-2px)}.fold.open .chev{transform:rotate(225deg) translate(-2px,-2px)}
.fold.open{border-radius:14px 14px 0 0;border-bottom:1px solid var(--line)}
.fold.open+.list{border-radius:0 0 16px 16px;border-top:0}
.gm{width:100%;display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;margin-top:18px;text-align:left;
  background:linear-gradient(160deg,#3a2a22,var(--card) 72%);border:1px solid rgba(217,119,87,.3);transition:transform .12s var(--ease)}
.gm:active{transform:scale(.985)}
.gm-ic{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(217,119,87,.18);font-size:19px}
.gm-main{flex:1;min-width:0}
.gm-main small{display:block;font:800 11px var(--round);letter-spacing:.06em;text-transform:uppercase;color:#e9a487;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gm-main b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font:750 15px/1.3 var(--round);margin-top:3px}

/* segmented control */
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px;gap:3px}
.seg button{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;height:36px;border-radius:9px;font:700 14px var(--round);color:var(--muted);transition:background .2s,color .2s}
.seg button.on{background:var(--card2);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.fair{margin:0 0 12px}.fair-h{font:700 13px var(--round);color:var(--muted);margin:0 0 6px}
.fair-r{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px}
.fair-r button{min-width:0;display:flex;align-items:center;justify-content:center;height:34px;border-radius:9px;font:700 13px var(--round);color:var(--muted);transition:background .2s,color .2s}
.fair-r button.on{background:var(--card2);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.fair-r button.f3.on,.fair-r button.f4.on{background:var(--bad);color:#1c1c1b}
.fair .hint{margin:6px 2px 0}.ask .fair{margin:14px 0}

/* Lineup */
.planline{display:flex;gap:9px;align-items:center;width:100%;padding:10px 12px;border-radius:14px;margin-bottom:12px;text-align:left;
  background:color-mix(in srgb,var(--s) 10%,var(--bg2));border:1px solid color-mix(in srgb,var(--s) 24%,transparent);font:650 13.5px/1.35 var(--round);color:var(--soft)}
.planline>span:not(.chev):not(.ava){flex:1;min-width:0}.planline ul{margin:4px 0 0;padding-left:16px}
.pl{width:100%;display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 12px;text-align:left}
.pl+.pl{border-top:1px solid rgba(255,255,255,.06)}
.pl:active{background:var(--card2)}
.slot{flex:none;width:44px;text-align:center;font:800 11.5px var(--round);color:var(--s);background:color-mix(in srgb,var(--s) 14%,transparent);border-radius:8px;padding:5px 0}
.slot.bn{color:var(--muted);background:rgba(255,255,255,.06)}
.pl-main{flex:1;min-width:0}
.pl-main b{display:block;font:700 15px/1.25 var(--round);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-main small{display:block;color:var(--muted);font:600 12px var(--round);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-pts{flex:none;text-align:right;font:800 17px/1.1 var(--round);font-variant-numeric:tabular-nums}
.pl-pts small{display:block;font:700 11px var(--round);color:var(--muted)}.pl-pts i{font-style:normal;color:var(--muted)}
.pl.bad{background:color-mix(in srgb,var(--bad) 10%,transparent)}.pl.bad .pl-main small{color:var(--bad)}
.pl.empty .slot{color:var(--bad);background:var(--badbg)}.pl.empty b{color:var(--bad)}
.total{display:flex;justify-content:space-between;padding:8px 6px 0;font:700 12.5px var(--round);color:var(--muted)}
.mu{padding:6px 10px 8px}
.mu-row{display:grid;grid-template-columns:minmax(0,1fr) 40px minmax(0,1fr);align-items:center;gap:6px;padding:7px 0;border-top:1px solid rgba(255,255,255,.05)}
.mu-row.mu-h{border-top:0;padding-top:2px;font:800 11.5px var(--round);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.mu-row.mu-h span:last-child{text-align:right}.mu-row.mu-h span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mu-s{text-align:center;font:800 11px var(--round);color:var(--s);background:color-mix(in srgb,var(--s) 13%,transparent);border-radius:7px;padding:4px 0}
.mu-p{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:6px;min-width:0}
.mu-p b{font:700 13.5px var(--round);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mu-p small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mu-p .mu-v{grid-row:1 / span 2;grid-column:2;text-align:right;font:800 16px/1.05 var(--round);font-variant-numeric:tabular-nums}
.mu-p .mu-v i{font-style:normal;color:var(--muted);font-weight:700}.mu-p .mu-v small{display:block;font:700 11px var(--round)}
.mu-p.r{grid-template-columns:auto minmax(0,1fr);text-align:right}.mu-p.r b,.mu-p.r small{grid-column:2}.mu-p.r .mu-v{grid-column:1;text-align:left}
.mu-p.bye,.mu-p.empty{opacity:.6}
.mu-score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:12px 14px 6px;font:800 28px/1 var(--round);font-variant-numeric:tabular-nums}
.mu-score span:last-child{text-align:right}.mu-score i{font:800 12px var(--round);font-style:normal;color:var(--muted)}

/* Trades: idea cards, the builder, the verdict */
.tcard{border-radius:16px;background:var(--card);border:1px solid rgba(255,255,255,.04);margin-bottom:8px;overflow:hidden}
.tc{width:100%;display:flex;gap:12px;align-items:center;padding:12px 12px 12px 10px;text-align:left}
.tc:active{background:var(--card2)}
.tc-g{flex:none;width:62px;text-align:center;font:800 21px/1 var(--round);font-variant-numeric:tabular-nums}
.tc-g small{display:block;font:700 11px var(--round);color:var(--muted);margin-top:4px}
.tc-g.up{color:var(--good)}.tc-g.down{color:var(--bad)}
.tc-b{flex:1;min-width:0}
.tc-r{display:flex;gap:6px;align-items:baseline;font:700 14px/1.4 var(--round);min-width:0}
.tc-r em{flex:none;width:32px;font:800 11px var(--round);letter-spacing:.05em;text-transform:uppercase;font-style:normal;color:var(--muted)}
.tc-r span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-b>small{display:block;margin-top:3px;font:600 12px var(--round);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-foot{display:flex;align-items:center;gap:8px;padding:0 12px 12px}
.tc-foot .btn{flex:1}
.tc-who{display:flex;align-items:center;gap:6px;padding:10px 12px 0;font:700 12.5px var(--round);color:var(--muted)}
.tc-who .pill{margin-left:auto}
.desk{background:var(--card);border-radius:18px;padding:12px;border:1px solid rgba(255,255,255,.05)}
.desk-h{display:flex;justify-content:space-between;align-items:center;height:28px;margin:0 2px 10px}
.desk-h b{font:800 17px var(--round)}.desk-h .linkish{font-size:14px;text-decoration:none;color:var(--muted);padding:6px 0}
.tq{position:relative}
.tq svg{position:absolute;left:13px;top:50%;width:18px;height:18px;margin-top:-9px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;pointer-events:none}
#tq{width:100%;height:46px;border-radius:13px;border:1px solid var(--line2);background:var(--bg);color:var(--ink);font:600 16px var(--round);padding:0 14px 0 40px;outline:none;-webkit-appearance:none;appearance:none}
#tq:focus{border-color:var(--clay)}#tq::placeholder{color:var(--muted);font-weight:500}
#tq::-webkit-search-cancel-button{-webkit-appearance:none}
#ac:not(:empty){margin-top:8px}
.ac-list{border-radius:14px;background:var(--bg2);border:1px solid var(--line);overflow:hidden}
.ac-list .pk+.pk{border-top:1px solid var(--line)}
.ac-trade{width:100%;display:grid;grid-template-columns:minmax(0,1fr) 20px minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;padding:10px 12px;border-radius:14px;border:1px solid color-mix(in srgb,var(--clay) 45%,transparent);background:color-mix(in srgb,var(--clay) 10%,var(--bg2));font:700 14px var(--round)}
.ac-trade small{display:block;font:800 11px var(--round);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.ac-trade b{color:var(--clay)}.ac-trade .arrow{color:var(--muted);text-align:center}
.ac-wish{grid-template-columns:minmax(0,1fr) auto}.ac-wish span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.sides{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:10px}
.sidebox{min-width:0;background:var(--bg2);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px}
.side-h{display:flex;align-items:center;height:22px;padding:0 4px;font:800 11px var(--round);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.side-t{display:flex;align-items:center;gap:4px;min-height:24px;margin-top:-6px;padding:0 4px;font:700 13px var(--round);color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.team-btn{width:100%;color:var(--clay)}.team-btn span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.team-btn .dn{flex:none;width:6px;height:6px;margin:0 2px 3px 3px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg)}
.tp{display:flex;align-items:center;gap:4px;height:48px;padding:0 2px 0 10px;border-radius:10px;background:var(--card2)}
.tp>div{flex:1;min-width:0}
.tp b{display:block;font:700 13.5px/1.25 var(--round);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp .x{flex:none;width:36px;height:40px;border-radius:9px;color:var(--muted);font:500 20px/1 var(--sans);text-align:center}
.tp .x:active{background:rgba(255,255,255,.08)}
.tp-add{height:42px;border-radius:10px;border:1px dashed var(--line2);color:var(--soft);font:700 13.5px var(--round);text-align:center}
.tp-add.on{border-style:solid;border-color:var(--clay);color:var(--clay)}
.picker{margin-top:10px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);overflow:hidden;max-height:420px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pk-h{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;align-items:center;height:42px;padding:0 12px;background:var(--bg2);border-bottom:1px solid var(--line);font:800 12px var(--round);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pk-h .linkish{text-transform:none;letter-spacing:0;font-size:14px;text-decoration:none;padding:8px 0}
.pk{width:100%;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:52px;padding:4px 12px;text-align:left}
.picker .pk+.pk{border-top:1px solid rgba(255,255,255,.05)}
.pk:active{background:rgba(255,255,255,.05)}.pk.on{background:color-mix(in srgb,var(--clay) 12%,transparent)}
.pk-pos{text-align:center;font:800 11.5px var(--round);color:var(--s);background:color-mix(in srgb,var(--s) 13%,transparent);border-radius:8px;padding:5px 0;white-space:nowrap;overflow:hidden}
.pk-main{min-width:0}.pk-main b{display:block;font:650 15px/1.25 var(--round);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-main small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-v{text-align:right;font:800 15px/1.15 var(--round);font-variant-numeric:tabular-nums;min-width:44px}
.pk-v small{display:block;font:700 11px var(--round);color:var(--muted)}.pk.on .pk-v small{color:var(--clay)}
.verdict{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.v-top{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:30px}
.v-chance{font:700 13px var(--round);color:var(--soft)}
.v-why{margin:10px 2px 0;font-size:14px;color:var(--soft)}
.nums{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:12px}
.nb{background:var(--bg2);border-radius:14px;padding:10px 12px;min-width:0}
.nb small{display:block;font:800 11px var(--round);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb b{display:block;font:800 30px/1.1 var(--round);font-variant-numeric:tabular-nums;margin-top:2px}.nb.up b{color:var(--good)}.nb.down b{color:var(--bad)}
.nb>span{display:block;font:600 12px var(--round);color:var(--muted)}
.nb i{display:block;margin-top:7px;padding-top:7px;border-top:1px solid rgba(255,255,255,.07);font:700 12.5px var(--round);font-style:normal;color:var(--soft);font-variant-numeric:tabular-nums}
.nb i small{margin-bottom:2px}
.nb i em{font-style:normal;font-weight:800}
details.more{margin-top:10px;border-radius:12px;background:var(--bg2)}
details.more>summary{list-style:none;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;font:750 14px var(--round);color:var(--soft);cursor:pointer}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:'';margin-left:auto;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translate(-2px,-2px)}
details.more[open]>summary::after{transform:rotate(225deg) translate(-2px,-2px)}
details.more>div{padding:0 12px 12px}
.whys h4{font:800 11px var(--round);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:10px 0 6px}
.whys ul{list-style:none;margin:0;padding:0}
.whys li{position:relative;display:flex;align-items:center;gap:6px;min-height:36px;padding:6px 0 6px 16px;font-size:13.5px;color:var(--soft)}
.whys li+li{border-top:1px solid rgba(255,255,255,.05)}
.whys li::before{content:'▲';position:absolute;left:0;font-size:11px;color:var(--good)}.whys li.out::before{content:'▼';color:var(--bad)}
.whys li.same::before{content:'–';color:var(--muted)}
.whys li em{flex:1;min-width:0;font-style:normal}.whys li b{color:var(--ink);font-family:var(--round);font-weight:700}
.whys li span{margin-left:auto;padding-left:8px;font:800 13px var(--round);font-variant-numeric:tabular-nums;color:var(--good)}.whys li.out span{color:var(--bad)}
.risks{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--soft)}
.hs{display:flex;gap:8px;overflow-x:auto;margin:10px -12px 0;padding:0 12px 2px;scrollbar-width:none;scroll-snap-type:x mandatory}
.hs::-webkit-scrollbar{display:none}
.tweak{flex:none;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:52px;max-width:240px;padding:8px 12px;border-radius:12px;border:1px solid var(--line2);text-align:left}
.tweak span{font:700 13.5px var(--round);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tweak small{font:600 12px var(--round);color:var(--muted)}
.tweak:active{background:var(--card2)}
.sub{font:800 11px var(--round);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:14px 2px 0}
.waiting{margin-top:12px;font:650 13px var(--round);color:var(--warn);display:flex;justify-content:space-between;gap:8px;align-items:center}
.waiting button{color:var(--muted);font:600 13px var(--round);text-decoration:underline;padding:6px 0;flex:none}
.cl{font-size:13.5px;color:var(--soft);margin:10px 0 0;padding:10px 11px;border-radius:12px;background:color-mix(in srgb,var(--clay) 9%,var(--bg2))}
.cl .tagc{font:800 12px var(--round);color:#e9a487;margin-right:4px}
.swap{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center}.swap .side{min-width:0}
.swap .arrow{color:var(--muted);font-size:18px}
.side small{display:block;font:800 11px var(--round);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.side small.add{color:var(--good)}.side small.drop{color:var(--bad)}
.pc{background:var(--card);border-radius:11px;padding:8px 10px;margin-bottom:5px}
.pc b{display:block;font:700 14px var(--round);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .sub2{display:block;font-size:12px;color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.fact{font:650 12.5px var(--round);background:var(--card);border-radius:8px;padding:4px 8px;color:var(--soft)}
.fact.ok{color:var(--good)}.fact.no{color:var(--bad)}
/* the front office (the AI trade builder) */
.ask{margin-top:14px}
.ask .sub{display:flex;align-items:baseline;gap:6px;margin:0 2px 6px}
.ask .opt{font:600 12px var(--round);letter-spacing:0;text-transform:none;color:var(--muted)}
#wish{display:block;width:100%;min-height:68px;max-height:160px;resize:none;border-radius:13px;border:1px solid var(--line2);background:var(--bg);color:var(--ink);
  font:600 16px/1.35 var(--round);padding:11px 13px;outline:none;-webkit-appearance:none;appearance:none}
#wish:focus{border-color:var(--clay)}#wish::placeholder{color:var(--muted);font-weight:500}
.ask .btn{width:100%;margin-top:10px}
.ask .hint{margin:8px 2px 0}
.ai-wait{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px;border-radius:14px;background:var(--warnbg);color:#f1d79e}
.ai-wait-m{flex:1;min-width:0}.ai-wait-m b{display:block;font:750 14px var(--round);color:var(--ink)}
.ai-wait-m small{display:block;font:600 12.5px/1.35 var(--round);margin-top:2px}
.ai-wait .linkish{flex:none;color:var(--soft);padding:8px 0}
.spin-dot{flex:none;width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(231,182,90,.3);border-top-color:var(--warn);animation:spin .9s linear infinite}
.verdict.ai .v-head{margin:10px 2px 12px;font:800 17px/1.3 var(--round);color:var(--ink)}
.verdict.flat{margin-top:0;padding-top:0;border-top:0}
.desk .sheet-swap>div{background:var(--bg2)}
.sheet-swap em{display:block;margin-top:3px;font:600 12px var(--round);font-style:normal;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-chg{margin:10px 0 0;padding:9px 11px;border-radius:12px;background:var(--tipbg);color:#c9d5f5;font-size:13.5px}
.ai-chg b{color:var(--ink)}
.ai-foot{display:flex;align-items:center;gap:10px;margin-top:12px;font:600 12.5px/1.35 var(--round);color:var(--muted)}
.ai-foot span{flex:1;min-width:0}.ai-foot .linkish{flex:none;padding:8px 0}
.ai-list{border-radius:14px;background:var(--bg2);overflow:hidden;margin-top:8px}
.ai-row{width:100%;display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 12px;text-align:left}
.ai-row+.ai-row{border-top:1px solid rgba(255,255,255,.06)}
.ai-row:active{background:rgba(255,255,255,.05)}
.ai-row-m{flex:1;min-width:0}
.ai-row-m b{font:700 14px/1.3 var(--round);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ai-row-m small{display:block;font:600 12px var(--round);color:var(--muted);margin-top:2px}
.ask-q{font:800 17px/1.3 var(--round);color:var(--ink)}

/* League */
.st{width:100%;display:grid;grid-template-columns:24px minmax(0,1fr) 96px;gap:10px;align-items:center;min-height:50px;padding:6px 12px}
.st+.st{border-top:1px solid rgba(255,255,255,.06)}
.st.mine{background:color-mix(in srgb,var(--clay) 14%,transparent)}
.st-rk{font:800 14px var(--round);color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.st-nm{min-width:0}.st-nm b{display:block;font:700 14.5px var(--round);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-nm small{display:block;font:600 12px var(--round);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-po{display:flex;align-items:center;gap:7px}
.bar2{flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.09);overflow:hidden}.bar2 i{display:block;height:100%;border-radius:6px;background:var(--s)}
.st-po b{width:40px;text-align:right;font:800 13px var(--round);font-variant-numeric:tabular-nums}
.cut{display:flex;align-items:center;gap:8px;padding:5px 12px;font:800 11px var(--round);letter-spacing:.06em;text-transform:uppercase;color:var(--warn);border-top:1px solid rgba(255,255,255,.06)}
.cut::before,.cut::after{content:'';flex:1;border-top:1px dashed color-mix(in srgb,var(--warn) 55%,transparent)}
.cut+.st{border-top:0}
.sc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;padding:9px 14px;font:650 14px var(--round)}
.sc+.sc{border-top:1px solid rgba(255,255,255,.06)}
.sc span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--soft)}.sc b{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;color:var(--soft)}
.sc .w{color:var(--ink)}.sc.mine{background:color-mix(in srgb,var(--clay) 12%,transparent)}
.form{font-size:12px}

/* sheets, the office, the toast */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;background:rgba(0,0,0,.55);animation:fade .2s}
.sheet>div{width:100%;max-width:620px;margin:0 auto;max-height:88vh;max-height:88dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  background:var(--bg2);border-radius:22px 22px 0 0;padding:8px 18px calc(var(--sab) + 18px);animation:up .28s var(--ease);border-top:1px solid var(--line);transition:transform .2s var(--ease)}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 12px}
.sheet h3{font:800 19px/1.25 var(--round);margin:0 0 8px}
.sheet p{margin:0 0 12px;color:var(--soft);font-size:14.5px}
.sheet ol{margin:0 0 14px;padding-left:20px;color:var(--soft);font-size:14.5px}.sheet li{margin-bottom:5px}
.sheet .btns{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.sheet .sub{margin:16px 2px 8px}
.who-line{display:flex;align-items:center;gap:8px;margin:0 0 10px;font:700 13px var(--round);color:var(--muted)}
.cmd{font:600 17px var(--mono);background:var(--bg);border:1px dashed var(--line2);border-radius:12px;padding:13px;text-align:center;margin:0 0 14px;color:var(--ink);-webkit-user-select:all;user-select:all}
.sheet-swap{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.sheet-swap>div{background:var(--card);border-radius:12px;padding:10px 12px;font:700 14.5px/1.35 var(--round)}
.sheet-swap small{display:block;font:800 11px var(--round);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.ptiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:4px 0 12px}
.ptiles div{background:var(--card);border-radius:12px;padding:9px 10px}
.ptiles small{display:block;font:800 11px var(--round);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.ptiles b{font:800 22px/1.2 var(--round);font-variant-numeric:tabular-nums}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
.stat{background:var(--card);border-radius:12px;padding:10px 11px}
.stat small{display:block;font:800 11px var(--round);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.stat b{display:block;font:750 15px/1.25 var(--round)}
.health{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px;padding:0 12px;font-size:14px}
.health+.health{border-top:1px solid rgba(255,255,255,.06)}
.chg{padding:10px 12px;font-size:13.5px}.chg+.chg{border-top:1px solid rgba(255,255,255,.06)}
.chg b{font-family:var(--round)}.chg small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.recap{font-size:14px;line-height:1.5;color:var(--soft)}.recap p{margin:0 0 10px}.recap b{color:var(--ink)}
.full{position:fixed;inset:0;z-index:45;background:var(--bg);display:flex;flex-direction:column;animation:up .28s var(--ease)}
.full-bar{display:flex;align-items:center;gap:10px;padding:calc(var(--sat) + 6px) calc(var(--sar) + 14px) 8px calc(var(--sal) + 14px);border-bottom:1px solid var(--line)}
.full-bar b{flex:1;font:800 18px var(--round)}
.full-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px calc(var(--sar) + 14px) calc(var(--sab) + 24px) calc(var(--sal) + 14px)}
#toast{position:fixed;left:50%;bottom:calc(var(--sab) + var(--tabh) + 22px);transform:translate(-50%,20px);opacity:0;z-index:60;background:var(--ink);color:#1c1c1b;
  font:700 14px var(--round);padding:10px 16px;border-radius:999px;transition:all .25s var(--ease);pointer-events:none;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(100%)}}@keyframes spin{to{transform:rotate(360deg)}}
@keyframes in{from{opacity:0;transform:translateY(6px)}}@keyframes sl{from{opacity:0;transform:translateX(28px)}}@keyframes sr{from{opacity:0;transform:translateX(-28px)}}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
